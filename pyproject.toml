[project]
name = "from-scratch"
version = "0.1.0"
description = "From-scratch building blocks of modern ML: transformers and LLMs, deep and offline RL, post-training and GPU kernels, each checked against a reference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
# Run from the repo root so tests can import e.g. `from transformer.attention.attention import ...`
pythonpath = ["."]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib -q"
